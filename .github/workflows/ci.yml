name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ponytail: cancel an in-progress run when a new push lands on the same
# branch / PR. Avoids wasting runner-minutes on superseded commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Orchestrator: type + unit tests ────────────────────────────────
  test-orchestrator:
    name: Orchestrator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      # ponytail: cache the uv venv + managed Python so repeat runs are
      # fast. Cache key includes uv.lock so a deps bump invalidates.
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --group dev

      - name: Run tests
        working-directory: ${{ github.workspace }}
        run: uv run pytest services/brotto-orchestrator/tests -v --tb=short

  # ─── Extension: type-check + bundle ────────────────────────────────
  build-extension:
    name: Extension build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clients/brotto-extension/package-lock.json

      - name: Install dependencies
        working-directory: clients/brotto-extension
        run: npm ci

      # ponytail: tsc --noEmit catches type errors without emitting
      # files. Run before the real build so the type-error signal is
      # surfaced even if esbuild happily swallows any.
      - name: Type check
        working-directory: clients/brotto-extension
        run: npx tsc --noEmit

      - name: Build
        working-directory: clients/brotto-extension
        run: npm run build

      # ponytail: surface the bundle for download in the Actions UI —
      # useful for QA to grab the exact artifact a green run produced.
      - name: Upload extension bundle
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: clients/brotto-extension/dist
          if-no-files-found: error
          retention-days: 7

  # ─── Aggregator ─────────────────────────────────────────────────────
  # ponytail: a single check name that branch protection requires. Both
  # jobs must succeed; if either fails, this fails.
  ci-success:
    name: CI
    runs-on: ubuntu-latest
    needs: [test-orchestrator, build-extension]
    if: always()
    steps:
      - name: All checks passed
        run: |
          if [ "${{ needs.test-orchestrator.result }}" != "success" ] || \
             [ "${{ needs.build-extension.result }}" != "success" ]; then
            echo "One or more jobs failed:"
            echo "  test-orchestrator: ${{ needs.test-orchestrator.result }}"
            echo "  build-extension:   ${{ needs.build-extension.result }}"
            exit 1
          fi
          echo "All checks passed."