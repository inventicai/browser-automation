name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ponytail: cancel an in-progress run when a new push lands on the same
# branch / PR. Avoids wasting runner-minutes on superseded commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Orchestrator: type + unit tests ────────────────────────────────
  test-orchestrator:
    name: Orchestrator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      # ponytail: pip + requirements*.txt instead of uv because the root
      # pyproject.toml + uv.lock aren't tracked yet — only the
      # requirements files are. uv searches for pyproject.toml at the
      # workspace root and fails the job before pytest ever runs.
      # Switch back to `uv sync --group dev` once the root pyproject is
      # committed to main.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # ponytail: services/brotto-orchestrator/src is the only thing on
      # PYTHONPATH that makes `brotto_orchestrator` importable. The old
      # Dockerfile already used this env var.
      - name: Run tests
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}/services/brotto-orchestrator/src
        run: |
          pytest services/brotto-orchestrator/tests -v --tb=short

  # ─── Extension: type-check + bundle ────────────────────────────────
  build-extension:
    name: Extension build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ponytail: build.mjs calls `rsvg-convert` to rasterize the SVG
      # icon at 16/32/48/128 px. librsvg isn't on the GitHub runner by
      # default — install it once per job. If the icon pipeline ever
      # moves to a Node renderer (e.g. @resvg/resvg-js), drop this step.
      - name: Install librsvg (rsvg-convert)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clients/brotto-extension/package-lock.json

      - name: Install dependencies
        working-directory: clients/brotto-extension
        run: npm ci

      # ponytail: tsc --noEmit catches type errors without emitting
      # files. Run before the real build so the type-error signal is
      # surfaced even if esbuild happily swallows any.
      - name: Type check
        working-directory: clients/brotto-extension
        run: npx tsc --noEmit

      - name: Build
        working-directory: clients/brotto-extension
        run: npm run build

      # ponytail: surface the bundle for download in the Actions UI —
      # useful for QA to grab the exact artifact a green run produced.
      - name: Upload extension bundle
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: clients/brotto-extension/dist
          if-no-files-found: error
          retention-days: 7

  # ─── Aggregator ─────────────────────────────────────────────────────
  # ponytail: a single check name that branch protection requires. Both
  # jobs must succeed; if either fails, this fails.
  ci-success:
    name: CI
    runs-on: ubuntu-latest
    needs: [test-orchestrator, build-extension]
    if: always()
    steps:
      - name: All checks passed
        run: |
          if [ "${{ needs.test-orchestrator.result }}" != "success" ] || \
             [ "${{ needs.build-extension.result }}" != "success" ]; then
            echo "One or more jobs failed:"
            echo "  test-orchestrator: ${{ needs.test-orchestrator.result }}"
            echo "  build-extension:   ${{ needs.build-extension.result }}"
            exit 1
          fi
          echo "All checks passed."