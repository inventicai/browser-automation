name: bench

on:
  schedule:
    # Nightly at 04:00 UTC.
    - cron: '0 4 * * *'
  push:
    branches:
      - main
      - 'experimental/**'
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONPATH: services/brotto-orchestrator/src
    strategy:
      fail-fast: false
      matrix:
        model:
          - haiku-4-5
          - sonnet-4-6
          - opus-4-7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install orchestrator dependencies
        working-directory: services/brotto-orchestrator
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r ../../requirements.txt -r ../../requirements-dev.txt
          .venv/bin/playwright install chromium --with-deps

      - name: Run benchmark suite
        env:
          AGENT_MODEL: ${{ matrix.model }}
          VENV: services/brotto-orchestrator/.venv/bin/python
        run: |
          set -euo pipefail
          cd services/brotto-orchestrator
          RESULTS="benchmark/runs.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.${AGENT_MODEL//\//-}.jsonl"
          mkdir -p benchmark
          rm -f "$RESULTS"
          # 5 tasks: login_form, data_extract, multi_step, error_recovery, approval_gate
          for task in login_form data_extract multi_step error_recovery approval_gate; do
            echo ">>> $task on $AGENT_MODEL"
            "$VENV" -m brotto_orchestrator.bench.cli \
              --task="$task" \
              --model="$AGENT_MODEL" \
              --results="$RESULTS" \
              -v
          done
          # Normalize to a stable artifact name per model for upload.
          cp "$RESULTS" "benchmark/runs.${AGENT_MODEL//\//-}.jsonl"
          echo "RESULTS_FILE=services/brotto-orchestrator/benchmark/runs.${AGENT_MODEL//\//-}.jsonl" >> "$GITHUB_ENV"

      - name: Summarize
        working-directory: services/brotto-orchestrator
        run: |
          .venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          results_path = Path(os.environ["RESULTS_FILE"])
          rows = [json.loads(l) for l in results_path.read_text().splitlines() if l.strip()]
          model = os.environ["AGENT_MODEL"]
          ok = sum(1 for r in rows if r.get("ok"))
          total = len(rows)
          print(f"## {model}: {ok}/{total}")
          for r in rows:
              mark = "PASS" if r.get("ok") else "FAIL"
              print(f"- {mark} {r.get('task')} ({r.get('elapsed_ms', '?')}ms)")
          PY

      - name: Upload results (JSONL)
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.model }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: services/brotto-orchestrator/benchmark/runs.${{ matrix.model }}.jsonl
          if-no-files-found: error
          retention-days: 30

  regression:
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current run artifacts
        uses: actions/download-artifact@v4
        with:
          path: current
          pattern: bench-*-*
          merge-multiple: true

      - name: Find previous successful run on same branch
        id: prev
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'bench.yml',
              branch: context.ref,
              status: 'success',
              per_page: 20,
            });
            const current = context.runId;
            // Skip the current run; pick the most recent *other* successful one.
            const prior = data.workflow_runs.find(r => r.id !== current && r.conclusion === 'success');
            if (!prior) {
              core.setOutput('run_id', '');
              core.setOutput('run_attempt', '');
              return;
            }
            core.setOutput('run_id', String(prior.id));
            core.setOutput('run_attempt', String(prior.run_attempt));

      - name: Download previous run artifacts
        if: steps.prev.outputs.run_id != ''
        uses: actions/github-script@v7
        with:
          script: |
            const runId = '${{ steps.prev.outputs.run_id }}';
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(runId),
            });
            const fs = require('fs');
            const path = require('path');
            for (const art of data.artifacts) {
              const buf = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: art.id,
                archive_format: 'zip',
              });
              const out = `previous/${art.name}.zip`;
              fs.mkdirSync(path.dirname(out), { recursive: true });
              fs.writeFileSync(out, Buffer.from(buf.data));
            }

      - name: Compare to baseline
        id: compare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, zipfile
          from pathlib import Path
          from collections import defaultdict

          THRESHOLD_PP = 5  # 5 percentage points

          def load(paths):
              rows = []
              for p in paths:
                  if not p.is_file():
                      continue
                  if p.suffix == '.zip':
                      with zipfile.ZipFile(p) as zf:
                          for name in zf.namelist():
                              if name.endswith('.jsonl'):
                                  with zf.open(name) as f:
                                      for line in f:
                                          line = line.decode().strip()
                                          if line:
                                              rows.append(json.loads(line))
                  else:
                      for line in p.read_text().splitlines():
                          line = line.strip()
                          if line:
                              rows.append(json.loads(line))
              return rows

          current = load(list(Path('current').rglob('*')))
          previous_dir = Path('previous')
          previous = []
          if previous_dir.is_dir() and any(previous_dir.iterdir()):
              previous = load(list(previous_dir.rglob('*')))

          if not previous:
              print("::notice::no baseline (no previous successful bench run on this branch)")
              print("## Regression check: no baseline — pass")
              sys.exit(0)

          def rate(rows, model, task):
              matches = [r for r in rows if r.get('model') == model and r.get('task') == task]
              if not matches:
                  return None
              return sum(1 for r in matches if r.get('ok')) / len(matches) * 100

          models = sorted({r.get('model') for r in current if r.get('model')})
          tasks = sorted({r.get('task') for r in current if r.get('task')})
          drops = []
          lines = ["## Regression check (vs previous successful run on this branch)", ""]
          lines.append("| Model | Task | Prev % | Now % | Δ |")
          lines.append("|-------|------|-------:|------:|--:|")
          for m in models:
              for t in tasks:
                  prev_rate = rate(previous, m, t)
                  cur_rate = rate(current, m, t)
                  if prev_rate is None or cur_rate is None:
                      continue
                  delta = cur_rate - prev_rate
                  lines.append(f"| {m} | {t} | {prev_rate:.1f} | {cur_rate:.1f} | {delta:+.1f} |")
                  if delta <= -THRESHOLD_PP:
                      drops.append((m, t, prev_rate, cur_rate, delta))

          if drops:
              lines.append("")
              lines.append(f"**FAILED**: {len(drops)} cell(s) dropped >{THRESHOLD_PP}pp")
              for m, t, p, c, d in drops:
                  lines.append(f"- {m}/{t}: {p:.1f}% → {c:.1f}% ({d:+.1f}pp)")
              print("\n".join(lines))
              # Also emit as job summary for visibility.
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write("\n".join(lines) + "\n")
              sys.exit(1)
          else:
              print("\n".join(lines))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write("\n".join(lines) + "\n")
          PY
