<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brotto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ─── Inventic Design Tokens (v1.0) ────────────────────────────────────
       Brand: Inventic Blue #0052CC + Light Blue #6DB3D8
       Type: Poppins (headings) + Inter (body)
       See: docs/design-instructions.md
    ─────────────────────────────────────────────────────────────────────── */
    :root {
      /* Brand palette */
      --brand-primary:       #0052CC;
      --brand-primary-hover: #003D99;
      --brand-primary-soft:  rgba(0, 82, 204, 0.10);
      --brand-light:         #6DB3D8;
      --brand-light-soft:    rgba(109, 179, 216, 0.16);
      --brand-deep:          #003D99;
      --brand-navy:          #001A4D;
      --brand-white:         #FFFFFF;

      /* Surfaces */
      --bg:           #FFFFFF;
      --surface:      #FFFFFF;
      --surface-1:    #F8FAFC;
      --surface-2:    #EEF3F8;
      --surface-3:    #E2EAF2;

      /* Borders */
      --border:       #D9E2EC;
      --border-soft:  #E8EEF4;

      /* Text */
      --text:         #1A1A1A;
      --text-muted:   #5A6877;
      --text-faint:   #94A2B0;

      /* Status (kept distinct from brand) */
      --green:        #16A34A;
      --green-soft:   rgba(22, 163, 74, 0.10);
      --red:          #DC2626;
      --red-soft:     rgba(220, 38, 38, 0.10);
      --amber:        #D97706;
      --amber-soft:   rgba(217, 119, 6, 0.10);

      /* Radii */
      --radius-sm:    6px;
      --radius:       10px;
      --radius-lg:    14px;
      --radius-xl:    20px;

      /* Shadows */
      --shadow-sm:    0 1px 2px rgba(0, 26, 77, 0.06);
      --shadow:       0 4px 12px rgba(0, 26, 77, 0.08), 0 1px 3px rgba(0, 26, 77, 0.05);
      --shadow-lg:    0 10px 28px rgba(0, 26, 77, 0.12), 0 2px 6px rgba(0, 26, 77, 0.06);

      --transition:   all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.55 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      flex-direction: column;
      min-width: 320px;
      max-width: 480px;
      overflow: hidden;
    }

    /* ─── Hidden elements (kept for background.ts DOM-id compatibility) ─── */
    #plannerUrl, #startingUrl, #connectBtn, #disconnectBtn,
    #refreshBtn, #statusPill, #brandDot, #stepCount, #timer,
    #connectionMeta { display: none !important; }

    /* ─── Brand mark (Inventic mountain) ────────────────────────────────── */
    .brand-mark {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      display: block;
    }
    .brand-mark--lg { width: 56px; height: 56px; }

    /* ─── Header ────────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      height: 60px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .brand-name {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 17px;
      color: var(--brand-primary);
      letter-spacing: -0.01em;
      line-height: 1;
    }

    /* Working spinner */
    #workingIndicator {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
    }
    #workingIndicator.active { display: flex; }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--brand-primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Status bar (steps + timer) ────────────────────────────────────── */
    #statusBar {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: var(--text-muted);
    }
    #statusBar.active { display: grid; }
    #statusBar .cell {
      background: var(--surface);
      padding: 9px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    #statusBar .label {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: 10px;
      color: var(--text-faint);
    }
    #statusBar .value {
      font-weight: 600;
      color: var(--text);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    /* ─── Tab lifecycle bar ─────────────────────────────────────────────── */
    .tab-bar {
      border-top: 1px solid var(--border);
      background: var(--surface-1);
      max-height: 200px;
      overflow: hidden;
      transition: max-height 0.18s ease;
    }
    .tab-bar[hidden] { display: none; }
    .tab-bar.collapsed { max-height: 32px; }
    .tab-bar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 14px;
      font-family: 'Poppins', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-faint);
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }
    .tab-bar-title { color: var(--text-faint); }
    .tab-bar-toggle {
      border: none;
      background: transparent;
      color: var(--text-faint);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .tab-bar-toggle:hover { color: var(--brand-primary); }
    .tab-bar-body {
      overflow-y: auto;
      max-height: 168px;
      padding: 4px 0;
    }
    .tab-bar.collapsed .tab-bar-body { display: none; }
    .tab-row {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 6px 14px;
      font-size: 12px;
      color: var(--text);
      border-bottom: 1px solid transparent;
    }
    .tab-row:hover { background: var(--surface-2); }
    .tab-row:last-child { border-bottom: none; }
    .tab-row-badge {
      font-family: 'Poppins', sans-serif;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--text-faint);
      text-align: center;
      border: 1px solid var(--border);
    }
    .tab-row-badge.opened  { background: var(--brand-primary-soft); color: var(--brand-primary); border-color: rgba(0, 82, 204, 0.20); }
    .tab-row-badge.closed  { background: var(--red-soft); color: var(--red); border-color: rgba(220, 38, 38, 0.20); }
    .tab-row-badge.focused { background: var(--green-soft); color: var(--green); border-color: rgba(22, 163, 74, 0.20); }
    .tab-row-info { min-width: 0; }
    .tab-row-title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .tab-row-url {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 11px;
      color: var(--text-faint);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-row-empty {
      padding: 12px 14px;
      color: var(--text-faint);
      font-size: 12px;
      font-style: italic;
    }

    /* ─── New Task button ──────────────────────────────────────────────── */
    .new-task-btn {
      align-self: center;
      padding: 9px 18px;
      border-radius: 999px;
      border: 1px solid var(--brand-primary);
      background: transparent;
      color: var(--brand-primary);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: var(--transition);
      margin: 16px auto;
      display: none;
      letter-spacing: 0.01em;
    }
    .new-task-btn:hover { background: var(--brand-primary-soft); transform: translateY(-1px); }
    .new-task-btn.visible { display: block; }

    /* ─── Login Continue button ───────────────────────────────────────── */
    .login-continue-btn {
      align-self: flex-start;
      margin: 6px 0 0 4px;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--brand-primary);
      background: var(--brand-primary);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    .login-continue-btn:hover:not(:disabled) { background: var(--brand-primary-hover); border-color: var(--brand-primary-hover); }
    .login-continue-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ─── Header actions ──────────────────────────────────────────────── */
    .hdr-actions { display: flex; gap: 4px; align-items: center; }

    .btn-icon {
      width: 32px;
      height: 32px;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .btn-icon:hover { background: var(--brand-primary-soft); color: var(--brand-primary); }
    .btn-icon svg { width: 16px; height: 16px; pointer-events: none; }

    .btn-icon.btn-stop {
      color: var(--red);
      width: 28px;
      height: 28px;
    }
    .btn-icon.btn-stop:hover { background: var(--red-soft); }

    /* ─── Settings overlay ────────────────────────────────────────────── */
    #settingsOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 26, 77, 0.40);
      z-index: 100;
      align-items: flex-start;
      justify-content: flex-end;
    }
    #settingsOverlay.open { display: flex; }

    #settingsPanel {
      width: 320px;
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: slide-in-right 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }
    @keyframes slide-in-right {
      from { transform: translateX(20px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }

    .settings-title {
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--brand-primary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .settings-section { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .input {
      width: 100%;
      padding: 9px 11px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-1);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      outline: none;
      transition: var(--transition);
    }
    .input:focus {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px var(--brand-primary-soft);
    }

    #settingsClose {
      align-self: flex-end;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
    }

    /* ─── Chat messages ────────────────────────────────────────────────── */
    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth;
      background: var(--bg);
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    #messages::-webkit-scrollbar-thumb:hover { background: var(--brand-light); }

    /* ─── Empty state ─────────────────────────────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 40px 24px;
      color: var(--text-muted);
      text-align: center;
      gap: 12px;
    }
    .empty-mark { line-height: 0; margin-top: 8px; }
    .empty-title {
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--brand-primary);
      margin-top: 6px;
      letter-spacing: -0.01em;
    }
    .empty-sub {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 280px;
      line-height: 1.6;
    }

    /* ─── Message bubbles ─────────────────────────────────────────────── */
    .message {
      display: flex;
      flex-direction: column;
      max-width: 92%;
      animation: msg-enter 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes msg-enter {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* ponytail: smooth fade-out when a message is removed mid-flight
       (e.g. login bubble disappears after Continue click). 180ms is
       short enough to feel instant, long enough to avoid flicker. */
    @keyframes msg-leave {
      from { opacity: 1; transform: translateY(0); max-height: 200px; margin-bottom: 6px; }
      to   { opacity: 0; transform: translateY(-4px); max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; }
    }
    .message.removing,
    .login-continue-btn.removing { animation: msg-leave 0.18s ease forwards; }

    .message.user      { align-self: flex-end; }
    .message.assistant { align-self: flex-start; }

    .bubble {
      padding: 11px 14px;
      border-radius: var(--radius-lg);
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
    }

    .message.user .bubble {
      background: var(--brand-primary);
      color: #fff;
      border-bottom-right-radius: var(--radius-sm);
      box-shadow: var(--shadow-sm);
    }

    .message.assistant .bubble {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-soft);
      border-bottom-left-radius: var(--radius-sm);
    }

    /* ponytail: transient bubble for login_required. Visually distinct
       from a regular assistant bubble (amber tint, dashed border) so the
       user reads it as a temporary status, not a permanent message. The
       "Waiting" badge with a slow pulse reinforces that the agent is
       paused and waiting on the human. Removed smoothly on resolve. */
    .message.login-required-msg .bubble {
      background: var(--amber-soft);
      color: var(--amber);
      border: 1px dashed rgba(217, 119, 6, 0.45);
      border-bottom-left-radius: var(--radius);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .login-required-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'Poppins', sans-serif;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--amber);
    }
    .login-required-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber);
      animation: login-pulse 1.6s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes login-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.35; transform: scale(0.75); }
    }
    .login-required-body {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
    }

    /* ─── Step bubble (with collapsible details) ──────────────────────── */
    .step-bubble { display: flex; flex-direction: column; gap: 4px; padding: 11px 14px; }
    .step-head { font-size: 14px; line-height: 1.45; }
    .step-details { display: flex; flex-direction: column; gap: 4px; }
    .step-details-toggle {
      align-self: flex-start;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 3px 9px;
      border-radius: 999px;
      cursor: pointer;
      transition: var(--transition);
    }
    .step-details-toggle:hover { color: var(--brand-primary); border-color: var(--brand-primary); }
    .step-details-body {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--surface-2);
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-soft);
      white-space: pre-wrap;
      overflow-x: auto;
    }

    .msg-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      padding: 0 4px;
    }
    .msg-name {
      font-family: 'Poppins', sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: var(--brand-primary);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ─── System / error / done messages ──────────────────────────────── */
    .message.system { align-self: center; max-width: 95%; }
    .message.system .bubble {
      background: transparent;
      color: var(--text-faint);
      font-size: 12px;
      font-style: italic;
      padding: 4px 8px;
      box-shadow: none;
      text-align: center;
    }

    .message.done { }
    .message.done .bubble {
      background: var(--green-soft);
      color: var(--green);
      border: 1px solid rgba(22, 163, 74, 0.18);
      border-radius: var(--radius);
      padding: 12px 16px;
    }
    .done-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .done-icon { font-size: 16px; }
    .done-summary { font-size: 13px; opacity: 0.95; }

    .message.error .bubble {
      background: var(--red-soft);
      color: var(--red);
      border: 1px solid rgba(220, 38, 38, 0.18);
    }

    /* ─── Plan preview card ───────────────────────────────────────────── */
    .plan-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      max-width: 92%;
      align-self: flex-start;
      animation: msg-enter 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .plan-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .plan-badge {
      background: var(--brand-primary);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .plan-sites {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding: 0 2px;
    }
    .plan-sites strong { color: var(--text); font-weight: 600; }
    .plan-approach-title {
      font-family: 'Poppins', sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: var(--brand-primary);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 6px;
      padding: 0 2px;
    }
    .plan-steps {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }
    .plan-steps li {
      display: flex;
      gap: 8px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.45;
      padding: 0 2px;
    }
    .plan-step-num {
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--brand-primary);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .plan-actions { display: flex; gap: 8px; }

    /* ─── Approval card ──────────────────────────────────────────────── */
    .approval-card {
      background: var(--surface);
      border: 1px solid var(--amber);
      border-left: 3px solid var(--amber);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      max-width: 92%;
      align-self: flex-start;
      animation: msg-enter 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .approval-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .approval-badge {
      background: var(--amber);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .approval-body {
      font-size: 13px;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.5;
    }
    .approval-preview {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      margin-bottom: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .approval-actions { display: flex; gap: 8px; }

    /* ─── Clarify card ───────────────────────────────────────────────── */
    .clarify-card {
      background: var(--surface);
      border: 1px solid var(--brand-primary);
      border-left: 3px solid var(--brand-primary);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      max-width: 92%;
      align-self: flex-start;
      animation: msg-enter 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .clarify-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .clarify-badge {
      background: var(--brand-primary);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .clarify-body {
      font-size: 13px;
      color: var(--text);
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .clarify-input-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .clarify-input {
      flex: 1;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 11px;
      resize: none;
      min-height: 38px;
      max-height: 96px;
      outline: none;
      transition: border-color 0.15s;
    }
    .clarify-input:focus { border-color: var(--brand-primary); box-shadow: 0 0 0 3px var(--brand-primary-soft); }
    .clarify-input::placeholder { color: var(--text-faint); }
    .clarify-send-btn {
      background: var(--brand-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 0 16px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .clarify-send-btn:hover { background: var(--brand-primary-hover); }
    .clarify-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .clarify-actions { display: flex; gap: 8px; margin-top: 8px; }

    /* ─── Inline logs (inside assistant bubbles) ─────────────────────── */
    .inline-log {
      font-size: 12px;
      color: var(--text-faint);
      font-style: italic;
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid var(--border-soft);
    }

    /* ─── Buttons ────────────────────────────────────────────────────── */
    .btn {
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:hover:not(:disabled) { background: var(--surface-3); border-color: var(--brand-light); }

    .btn-sm { padding: 7px 13px; }

    .btn-primary {
      background: var(--brand-primary);
      border-color: var(--brand-primary);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--brand-primary-hover);
      border-color: var(--brand-primary-hover);
    }

    .btn-danger {
      background: var(--red-soft);
      border-color: rgba(220, 38, 38, 0.25);
      color: var(--red);
    }
    .btn-danger:hover:not(:disabled) { background: var(--red); color: #fff; border-color: var(--red); }

    .btn-ghost { background: transparent; border-color: transparent; }

    /* ─── Input area (bottom) ─────────────────────────────────────────── */
    #inputArea {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px 16px;
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    #goal {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      padding: 11px 13px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface-1);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      resize: none;
      outline: none;
      line-height: 1.5;
      transition: var(--transition);
    }
    #goal:focus {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px var(--brand-primary-soft);
    }
    #goal::placeholder { color: var(--text-faint); }

    #sendBtn {
      width: 42px;
      height: 42px;
      border-radius: var(--radius);
      border: none;
      background: var(--brand-primary);
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: var(--transition);
    }
    #sendBtn:hover:not(:disabled) {
      background: var(--brand-primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 82, 204, 0.30);
    }
    #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    #sendBtn svg { width: 16px; height: 16px; pointer-events: none; }

    .input-hint {
      font-size: 11px;
      color: var(--text-faint);
      margin-top: 6px;
      padding: 0 2px;
    }

    /* ─── Status pill (header) ───────────────────────────────────────── */
    .status-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-family: 'Poppins', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: var(--surface-3);
      color: var(--text-muted);
      border: 1px solid var(--border);
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .status-pill.connecting    { background: var(--brand-light-soft); color: var(--brand-deep); border-color: rgba(109, 179, 216, 0.40); }
    .status-pill.connected     { background: var(--green-soft); color: var(--green); border-color: rgba(22, 163, 74, 0.25); }
    .status-pill.executing     { background: var(--brand-primary-soft); color: var(--brand-primary); border-color: rgba(0, 82, 204, 0.25); }
    .status-pill.paused        { background: var(--amber-soft); color: var(--amber); border-color: rgba(217, 119, 6, 0.25); }
    .status-pill.done          { background: var(--green-soft); color: var(--green); border-color: rgba(22, 163, 74, 0.25); }
    .status-pill.error         { background: var(--red-soft); color: var(--red); border-color: rgba(220, 38, 38, 0.25); }
    .status-pill.reconnecting  { background: var(--brand-light-soft); color: var(--brand-deep); border-color: rgba(109, 179, 216, 0.40); }

    /* ─── Tool subtitle (inside step bubbles) ───────────────────────── */
    .tool-subtitle {
      margin-top: 6px;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 11px;
      color: var(--text-faint);
      word-break: break-all;
    }

    /* ─── Final answer / facts ───────────────────────────────────────── */
    .final-answer { font-size: 14px; line-height: 1.5; padding: 4px 0 12px; color: var(--text); }
    .final-answer-text { font-weight: 500; }

    .step-page-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-faint);
      padding: 3px 0 6px;
      border-bottom: 1px dashed var(--border);
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .step-page-chip-icon { color: var(--brand-primary); flex-shrink: 0; }
    .step-page-chip-url { font-family: ui-monospace, 'SF Mono', Menlo, monospace; color: var(--text-muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
    .step-page-chip-title { color: var(--text); overflow: hidden; text-overflow: ellipsis; }

    .facts {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 4px 0 10px;
      padding: 9px 11px;
      background: var(--surface-2);
      border-radius: 8px;
      border: 1px solid var(--border-soft);
    }
    .facts-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
    .facts-label {
      font-family: 'Poppins', sans-serif;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 9px;
      min-width: 64px;
      font-weight: 700;
    }
    .facts-link {
      color: var(--brand-primary);
      text-decoration: none;
      word-break: break-all;
      padding: 2px 7px;
      background: var(--brand-primary-soft);
      border-radius: 4px;
      font-weight: 500;
    }
    .facts-link:hover { text-decoration: underline; }
    .facts-code {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      background: var(--surface);
      padding: 2px 7px;
      border-radius: 4px;
      color: var(--text);
      border: 1px solid var(--border-soft);
    }
    .facts-date { padding: 2px 7px; background: var(--surface); border-radius: 4px; color: var(--text); border: 1px solid var(--border-soft); }

    .done-caption {
      font-size: 11px;
      color: var(--text-faint);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .done-icon { font-size: 14px; color: var(--green); }
  </style>
</head>
<body>

<!-- ── Header ────────────────────────────────────────────────────────── -->
<header>
  <div class="brand">
    <!-- Inventic mountain mark: primary peak + secondary light-blue peak -->
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M5 24 L14 8 L18 14 L23 19 L26 22 Z" fill="#0052CC"/>
      <path d="M18 14 L23 19 L26 22 L24 22 L19 18 Z" fill="#6DB3D8"/>
    </svg>
    <span class="brand-name">Brotto</span>
  </div>

  <div id="workingIndicator" aria-live="polite">
    <div class="spinner"></div>
    <span>Working</span>
  </div>

  <div class="hdr-actions">
    <button id="stopBtn" class="btn-icon btn-stop" title="Stop" style="display:none" aria-label="Stop task">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>
    <button id="settingsBtn" class="btn-icon" title="Settings" aria-label="Open settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>
</header>

<!-- ── Hidden placeholders (preserved for background.ts DOM-id compatibility) ── -->
<input id="plannerUrl" type="hidden" value="http://localhost:8000">
<input id="startingUrl" type="hidden">
<button id="startBtn" style="display:none">Start task</button>
<button id="refreshBtn" style="display:none">Refresh</button>
<span id="connectionMeta" style="display:none">Not connected</span>
<span id="brandDot" style="display:none"></span>
<span id="stepCount" style="display:none">0 steps</span>
<span id="timer" style="display:none"></span>

<!-- ── Status bar (steps + timer) ──────────────────────────────────── -->
<div id="statusBar" aria-live="polite">
  <div class="cell">
    <span class="label">Steps</span>
    <span class="value" id="stepCountActive">0</span>
  </div>
  <div class="cell">
    <span class="label">Time</span>
    <span class="value" id="timerActive">0.0s</span>
  </div>
</div>

<!-- ── Tab lifecycle ──────────────────────────────────────────────── -->
<div id="tabBar" class="tab-bar" aria-live="polite" hidden>
  <div class="tab-bar-header">
    <span class="tab-bar-title">Tabs opened</span>
    <button type="button" id="tabBarToggle" class="tab-bar-toggle" aria-expanded="true">−</button>
  </div>
  <div class="tab-bar-body" id="tabBarBody"></div>
</div>

<!-- ── Chat messages ──────────────────────────────────────────────── -->
<main id="messages" aria-live="polite">
  <div class="empty-state" id="emptyState">
    <div class="empty-mark">
      <svg class="brand-mark brand-mark--lg" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M5 24 L14 8 L18 14 L23 19 L26 22 Z" fill="#0052CC"/>
        <path d="M18 14 L23 19 L26 22 L24 22 L19 18 Z" fill="#6DB3D8"/>
      </svg>
    </div>
    <div class="empty-title">Brotto</div>
    <div class="empty-sub">Describe what you'd like to do in your browser and Brotto will get it done for you.</div>
  </div>
</main>

<!-- ── New task button ──────────────────────────────────────────── -->
<button class="new-task-btn" id="newTaskBtn" title="Start a new task">
  + New task
</button>

<!-- ── Input area ────────────────────────────────────────────────── -->
<section id="inputArea">
  <div class="input-row">
    <textarea id="goal" placeholder="What would you like Brotto to do?" rows="1" maxlength="2000" aria-label="Task description"></textarea>
    <button id="sendBtn" title="Send" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
  <div class="input-hint">Press Enter to send · Shift+Enter for newline</div>
</section>

<!-- ── Settings overlay ─────────────────────────────────────────── -->
<div id="settingsOverlay" role="dialog" aria-modal="true" aria-label="Settings">
  <div id="settingsPanel">
    <button id="settingsClose" class="btn-icon" aria-label="Close settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <div class="settings-title">Settings</div>
    <div class="settings-section">
      <label for="plannerUrlSetting">Orchestrator URL</label>
      <input id="plannerUrlSetting" class="input" type="url" placeholder="http://localhost:8000">
      <p class="settings-hint">URL of the Brotto orchestrator server.</p>
    </div>
  </div>
</div>

<script src="sidepanel.js"></script>
</body>
</html>
